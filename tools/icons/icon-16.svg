      <stop offset="0.85" stop-color="#F59168"/>
      <stop offset="1" stop-color="#FFC979"/>
    </linearGradient>
  </defs>
  <rect x="0" y="2" width="13" height="10" rx="2" fill="url(#sky)"/>
  <circle cx="4.5" cy="6.25" r="1.75" fill="#FFF4D8"/>
