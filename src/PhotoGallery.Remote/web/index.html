<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark light">
  <title>Photo Gallery</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" /></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.5 15.5 21 21" /></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H5m6-7-7 7 7 7" /></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6M12 7.5v.5" /></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14" /></symbol>
    <symbol id="i-live" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><circle cx="12" cy="12" r="6.5" /><circle cx="12" cy="12" r="10" stroke-dasharray="1.6 2.2" /></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none" /></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c.6-3.8 3.2-6 6.5-6s5.9 2.2 6.5 6" /><circle cx="17" cy="9" r="2.5" /><path d="M16 14c2.9 0 5 1.8 5.5 5" /></symbol>
    <symbol id="i-photos" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="2" /><path d="m3 17 5-4 4 3 3-2 6 4" /></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" /></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2" /><path d="m16 10 5-3v10l-5-3" /></symbol>
    <symbol id="i-album" viewBox="0 0 24 24"><rect x="6" y="3" width="15" height="15" rx="2" /><path d="M3 7v12a2 2 0 0 0 2 2h12" /></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z" /><circle cx="8" cy="8" r="1.5" /></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" /></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z" /><circle cx="12" cy="9.5" r="2.5" /></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" /></symbol>
    <symbol id="i-blur" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l5 5M8.5 11h5" /></symbol>
    <symbol id="i-similar" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5" /><rect x="13" y="13" width="8" height="8" rx="1.5" /><path d="M13 7h4a1 1 0 0 1 1 1v3M11 17H7a1 1 0 0 1-1-1v-3" /></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></symbol>
    <symbol id="i-face" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" /><circle cx="12" cy="10" r="2.5" /><path d="M8 16c1-2 2.4-3 4-3s3 1 4 3" /></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3" /><path d="M8 9h8M12 9v7" /></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7" /></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4 2v-8.5z" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
    <symbol id="i-signout" viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 8l-4 4 4 4M6 12h10" /></symbol>
  </svg>

  <!-- Sign in -->
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="icon.svg" alt="" width="56" height="56">
      <h1>Photo Gallery</h1>
      <p id="login-host" class="muted"></p>
      <label for="passphrase">Passphrase</label>
      <input id="passphrase" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
      <p class="fine">Set the passphrase in Settings → Remote access on the computer with the photos.</p>
    </form>
  </div>

  <!-- The library -->
  <div id="app" class="app" hidden>
    <header class="top">
      <button id="menu" class="icon-button" type="button" aria-label="Menu"><svg><use href="#i-menu" /></svg></button>
      <a class="brand" href="#/"><img src="icon.svg" alt="" width="22" height="22"><span id="brand-name">Photo Gallery</span></a>
      <form id="search-form" class="search" role="search">
        <svg class="search-icon"><use href="#i-search" /></svg>
        <input id="search" type="search" placeholder="Search: people, places, things, text, what was said" list="suggestions"
               autocomplete="off" enterkeyhint="search" aria-label="Search">
        <button id="search-clear" class="icon-button small" type="button" aria-label="Clear search" hidden><svg><use href="#i-close" /></svg></button>
        <datalist id="suggestions"></datalist>
      </form>
      <button id="sign-out" class="icon-button" type="button" title="Sign out" aria-label="Sign out"><svg><use href="#i-signout" /></svg></button>
    </header>

    <nav id="nav" class="nav">
      <a href="#/" data-section="photos"><svg><use href="#i-photos" /></svg>Photos</a>
      <a href="#/onthisday" data-section="onthisday"><svg><use href="#i-calendar" /></svg>On this day</a>
      <a href="#/favorites" data-section="favorites"><svg><use href="#i-star" /></svg>Favorites</a>
      <a href="#/live" data-section="live"><svg><use href="#i-live" /></svg>Live Photos</a>
      <a href="#/videos" data-section="videos"><svg><use href="#i-video" /></svg>Videos</a>
      <hr>
      <a href="#/people" data-section="people"><svg><use href="#i-people" /></svg>People</a>
      <a href="#/tags" data-section="tags"><svg><use href="#i-tag" /></svg>Tags</a>
      <a href="#/folders" data-section="folders"><svg><use href="#i-folder" /></svg>Folders</a>
      <a href="#/map" data-section="map"><svg><use href="#i-map" /></svg>Map</a>
      <a href="#/albums" data-section="albums"><svg><use href="#i-album" /></svg>Albums</a>
      <hr>
      <a href="#/duplicates" data-section="duplicates"><svg><use href="#i-copy" /></svg>Duplicates</a>
      <a href="#/blurry" data-section="blurry"><svg><use href="#i-blur" /></svg>Blurry photos</a>
    </nav>

    <main id="main" class="main">
      <!-- Shown instead of the title bar while photos are selected -->
      <section id="selbar" class="selbar" hidden>
        <button id="sel-clear" class="icon-button" type="button" title="Clear the selection (Esc)" aria-label="Clear the selection"><svg><use href="#i-close" /></svg></button>
        <span id="sel-count"></span>
        <div class="sel-actions">
          <button id="sel-all" type="button">Select all</button>
          <button id="sel-rate" type="button"><svg><use href="#i-star" /></svg>Rate</button>
          <button id="sel-album" type="button" data-change><svg><use href="#i-album" /></svg>Add to album</button>
          <button id="sel-unalbum" type="button" data-change hidden>Remove from album</button>
          <button id="sel-tag" type="button" data-change><svg><use href="#i-tag" /></svg>Tag</button>
          <button id="sel-delete" type="button" class="danger" data-change><svg><use href="#i-trash" /></svg>Delete</button>
        </div>
      </section>

      <section id="bar" class="bar">
        <div class="titles">
          <h1 id="title"></h1>
          <p id="subtitle" class="muted"></p>
        </div>
        <div id="section-actions" class="controls"></div>
        <div id="controls" class="controls">
          <div id="exact" class="segmented" role="group" aria-label="Match">
            <button type="button" data-exact="0">Best matches</button>
            <button type="button" data-exact="1">Exact words</button>
          </div>
          <select id="sort" aria-label="Sort">
            <option value="best">Best match first</option>
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
          </select>
          <select id="group" aria-label="Group">
            <option value="none">No groups</option>
            <option value="day">By day</option>
            <option value="month">By month</option>
            <option value="year">By year</option>
          </select>
          <div class="pop-anchor">
            <button id="filters-button" type="button" aria-haspopup="true"><svg><use href="#i-filter" /></svg><span>Filters</span></button>
            <div id="filters-pop" class="popover" hidden>
              <label>Show <select id="kind">
                <option value="">Photos and videos</option>
                <option value="photos">Photos only</option>
                <option value="videos">Videos only</option>
              </select></label>
              <label>Rating <select id="rating">
                <option value="0">Any rating</option>
                <option value="1">★ or more</option>
                <option value="2">★★ or more</option>
                <option value="3">★★★ or more</option>
                <option value="4">★★★★ or more</option>
                <option value="5">★★★★★</option>
              </select></label>
              <label>Screenshots <select id="screenshots">
                <option value="">As usual here</option>
                <option value="hide">Leave out</option>
                <option value="with">Include</option>
                <option value="only">Only screenshots</option>
              </select></label>
              <label class="check"><input id="live-only" type="checkbox"> Live Photos and motion photos only</label>
              <div class="popover-actions"><button id="filters-clear" type="button">Clear filters</button></div>
            </div>
          </div>
          <div class="pop-anchor">
            <button id="people-button" type="button" aria-haspopup="true"><svg><use href="#i-people" /></svg><span>People</span></button>
            <div id="people-pop" class="popover" hidden>
              <input id="people-find" type="search" placeholder="Find a person" autocomplete="off">
              <div id="people-list" class="people-list"></div>
              <div class="popover-actions"><button id="people-clear" type="button">Clear</button></div>
            </div>
          </div>
          <div class="zoom" role="group" aria-label="Tile size">
            <button id="zoom-out" type="button" aria-label="Smaller tiles">−</button>
            <button id="zoom-in" type="button" aria-label="Bigger tiles">+</button>
          </div>
        </div>
      </section>
      <div id="chips" class="chips"></div>
      <div id="map-pane" class="map-pane" hidden>
        <div id="map"></div>
        <div id="map-status" class="map-status"></div>
      </div>
      <div id="scroller" class="scroller" tabindex="-1">
        <div id="sizer" class="sizer"></div>
        <div id="empty" class="empty" hidden></div>
      </div>
      <div id="cards-page" class="cards-page" hidden>
        <input id="cards-find" type="search" placeholder="Find" autocomplete="off">
        <div id="cards" class="cards"></div>
      </div>
      <div id="page" class="page" hidden></div>
      <div id="date-pill" class="date-pill" hidden></div>
    </main>
  </div>

  <!-- Viewer -->
  <div id="viewer" class="viewer" hidden>
    <div class="viewer-top">
      <button id="v-close" class="icon-button" type="button" title="Back (Esc)" aria-label="Back"><svg><use href="#i-back" /></svg></button>
      <div class="v-title">
        <div id="v-date"></div>
        <div id="v-place" class="muted"></div>
      </div>
      <div class="v-actions">
        <button id="v-live" class="live-button" type="button" title="Play the Live Photo (Space)" hidden><svg><use href="#i-live" /></svg>LIVE</button>
        <div id="v-stars" class="stars" role="group" aria-label="Rating"></div>
        <button id="v-faces" class="icon-button toggle" type="button" title="Show faces (F)" aria-label="Show faces" hidden><svg><use href="#i-face" /></svg></button>
        <button id="v-text" class="icon-button toggle" type="button" title="Show text in the photo (T)" aria-label="Show text" hidden><svg><use href="#i-text" /></svg></button>
        <button id="v-similar" class="icon-button" type="button" title="Similar photos" aria-label="Similar photos"><svg><use href="#i-similar" /></svg></button>
        <button id="v-album" class="icon-button" type="button" title="Add to album" aria-label="Add to album" data-change><svg><use href="#i-album" /></svg></button>
        <a id="v-download" class="icon-button" title="Download the original" aria-label="Download the original"><svg><use href="#i-download" /></svg></a>
        <button id="v-delete" class="icon-button" type="button" title="Delete (Del)" aria-label="Delete" data-change><svg><use href="#i-trash" /></svg></button>
        <button id="v-info" class="icon-button" type="button" title="Details (I)" aria-label="Details"><svg><use href="#i-info" /></svg></button>
      </div>
    </div>
    <div class="viewer-body">
      <div id="v-stage" class="v-stage">
        <div id="v-zoom" class="v-zoom">
          <img id="v-img" alt="" draggable="false">
          <div id="v-overlay" class="v-overlay"></div>
        </div>
        <video id="v-video" playsinline hidden></video>
        <div id="v-message" class="v-message" hidden></div>
        <div id="v-zoom-label" class="v-zoom-label" hidden></div>
        <button id="v-prev" class="v-nav prev" type="button" aria-label="Previous"><svg><use href="#i-left" /></svg></button>
        <button id="v-next" class="v-nav next" type="button" aria-label="Next"><svg><use href="#i-right" /></svg></button>
      </div>
      <aside id="v-panel" class="v-panel" hidden></aside>
    </div>
  </div>

  <!-- Questions: names, choices, confirmations -->
  <div id="dialog" class="dialog-back" hidden>
    <form id="dialog-form" class="dialog" method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <input id="dialog-input" type="text" autocomplete="off" list="dialog-options" hidden>
      <datalist id="dialog-options"></datalist>
      <div id="dialog-choices" class="dialog-choices" hidden></div>
      <div class="dialog-buttons">
        <button id="dialog-cancel" type="button">Cancel</button>
        <button id="dialog-ok" type="submit" class="primary">OK</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
