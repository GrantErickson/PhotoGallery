<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { font-family: "Segoe UI Variable", "Segoe UI", sans-serif; }
    #status { position: absolute; z-index: 1000; left: 50%; top: 12px; transform: translateX(-50%);
              background: rgba(0,0,0,.65); color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 13px; }
    .marker-cluster.selected div { background-color: rgba(0, 120, 212, .9) !important; color: #fff; }
    .marker-cluster.selected { background-color: rgba(0, 120, 212, .4) !important; }
    .photo-pin { width: 44px; height: 44px; border-radius: 6px; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5);
                 background: #ccc center/cover no-repeat; }
    .photo-pin.focused { border-color: #ff9f1c; border-width: 3px; }
    .place-label { background: rgba(0, 120, 212, .85); color: #fff; border: 0; border-radius: 10px; padding: 2px 8px;
                   font-weight: 600; box-shadow: none; }
    .place-label::before { display: none; }
    /* Dark mode: the light OpenStreetMap tiles inverted (hue turned back so water stays blue), and dark controls. */
    body.dark #map { background: #1b1b1b; }
    body.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.8); }
    body.dark .leaflet-bar a { background: #2b2b2b; color: #e6e6e6; border-bottom-color: #444; }
    body.dark .leaflet-bar a:hover { background: #3a3a3a; }
    body.dark .leaflet-control-attribution { background: rgba(32, 32, 32, .8); color: #bbb; }
    body.dark .leaflet-control-attribution a { color: #8ab4f8; }
    body.dark .leaflet-tooltip:not(.place-label) { background: #2b2b2b; color: #e6e6e6; border-color: #444; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">Loading photo locations…</div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    // Messages to the app: {type:"bounds", south, west, north, east} and {type:"open", id}.
    const post = m => window.chrome?.webview?.postMessage(m);
    // The app's theme: from the address at load, then setTheme(true/false) when it changes.
    document.body.classList.toggle("dark", new URLSearchParams(location.search).get("dark") === "1");
    window.setTheme = dark => document.body.classList.toggle("dark", dark);
    const statusBox = document.getElementById("status");
    const map = L.map("map", { worldCopyJump: true, preferCanvas: true }).setView([20, 0], 2);
    // OSM has tiles to level 19; allow two more levels of over-zoom to separate photos taken close together.
    map.setMaxZoom(21);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 21,
      maxNativeZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const clusters = L.markerClusterGroup({
      chunkedLoading: true, maxClusterRadius: 60, showCoverageOnHover: false,
      zoomToBoundsOnClick: false, spiderfyOnMaxZoom: true
    });
    map.addLayer(clusters);

    // Clicking a cluster lists exactly its photos (instead of zooming); clicking the map goes back to "everything in view".
    let selected = null;
    clusters.on("clusterclick", e => {
      if (selected) selected.getElement()?.classList.remove("selected");
      selected = e.layer;
      selected.getElement()?.classList.add("selected");
      post({ type: "selection", ids: e.layer.getAllChildMarkers().map(m => m.options.photoId) });
    });
    function clearSelection() {
      if (!selected) return;
      selected.getElement()?.classList.remove("selected");
      selected = null;
      post({ type: "clear" });
      sendBounds();
    }
    window.clearSelection = clearSelection;

    // Your places: labelled circles; click one to edit it and list its photos.
    const placeLayer = L.layerGroup().addTo(map);
    window.setPlaces = list => {
      placeLayer.clearLayers();
      for (const p of list) {
        const circle = L.circle([p.lat, p.lon], { radius: p.r, color: "#0078d4", weight: 2, fillOpacity: 0.08 });
        circle.bindTooltip(p.name, { permanent: true, direction: "center", className: "place-label" });
        circle.on("click", e => { L.DomEvent.stopPropagation(e); post({ type: "place", id: p.id }); });
        circle.addTo(placeLayer);
      }
    };

    // Making a place: the next click on the map sets the centre; the pin can then be dragged; the app sets the radius.
    let draft = null, draftPin = null, placing = false;
    window.startPlacing = () => { placing = true; map.getContainer().style.cursor = "crosshair"; };
    window.setDraft = (lat, lon, r) => {
      if (!draft) {
        draft = L.circle([lat, lon], { radius: r, color: "#ff9f1c", weight: 3, dashArray: "6 4", fillOpacity: 0.12 }).addTo(map);
        draftPin = L.marker([lat, lon], { draggable: true }).addTo(map);
        draftPin.on("dragend", () => { const ll = draftPin.getLatLng(); post({ type: "placeCenter", lat: ll.lat, lon: ll.lng }); });
      } else {
        draft.setLatLng([lat, lon]); draft.setRadius(r); draftPin.setLatLng([lat, lon]);
      }
    };
    window.clearDraft = () => {
      if (draft) { map.removeLayer(draft); map.removeLayer(draftPin); draft = draftPin = null; }
      placing = false;
      map.getContainer().style.cursor = "";
    };
    // A view asked for while Leaflet is still animating a zoom (the first fit to all photos) would be undone when that
    // animation ends, so wait for it; then jump there without animating.
    function whenSettled(action) {
      if (map._animatingZoom) { map.once("zoomend", () => whenSettled(action)); return; }
      map.stop();
      action();
    }
    window.fitCircle = (lat, lon, r) => whenSettled(() => map.fitBounds(L.latLng(lat, lon).toBounds(r * 2.4), { animate: false }));
    window.focusOn = (lat, lon, zoom) => whenSettled(() => map.setView([lat, lon], zoom, { animate: false }));

    map.on("click", e => {
      if (placing) {
        placing = false;
        map.getContainer().style.cursor = "";
        post({ type: "placeCenter", lat: e.latlng.lat, lon: e.latlng.lng });
        return;
      }
      clearSelection();
    });

    // The map swallows mouse and keyboard input, so pass the app's back/forward gestures through.
    window.addEventListener("mouseup", e => {
      if (e.button === 3 || e.button === 4) { e.preventDefault(); post({ type: "history", back: e.button === 3 }); }
    });
    window.addEventListener("keydown", e => {
      if (e.altKey && (e.key === "ArrowLeft" || e.key === "ArrowRight")) { e.preventDefault(); post({ type: "history", back: e.key === "ArrowLeft" }); }
    });

    // Individual photos show their thumbnail once you zoom in far enough to see them unclustered.
    const pin = id => L.divIcon({
      className: "",
      html: `<div class="photo-pin" style="background-image:url('https://gallery.local/thumbs/${(id & 255).toString(16).padStart(2, "0")}/${id}.jpg')"></div>`,
      iconSize: [44, 44], iconAnchor: [22, 22]
    });

    function sendBounds() {
      const b = map.getBounds();
      post({ type: "bounds", south: b.getSouth(), west: b.getWest(), north: b.getNorth(), east: b.getEast() });
    }
    window.sendBounds = sendBounds;
    let timer;
    map.on("moveend", () => { clearTimeout(timer); timer = setTimeout(sendBounds, 250); });

    fetch("https://gallery.local/map/points.json")
      .then(r => r.json())
      .then(points => {
        const markers = points.map(([id, lat, lon]) => {
          const m = L.marker([lat, lon], { icon: pin(id), photoId: id });
          m.on("click", () => post({ type: "open", id }));
          return m;
        });
        clusters.addLayers(markers);
        statusBox.textContent = `${points.length.toLocaleString()} photos with a location`;
        setTimeout(() => statusBox.style.display = "none", 4000);
        // Fit to the points themselves: the cluster layer's bounds are empty while chunked loading runs.
        if (points.length) {
          try { map.fitBounds(L.latLngBounds(points.map(p => [p[1], p[2]])), { maxZoom: 12 }); } catch (e) { console.warn(e); }
        }
        sendBounds();
        post({ type: "ready" });
      })
      .catch(e => statusBox.textContent = "Couldn't load photo locations: " + e);
  </script>
</body>
</html>
